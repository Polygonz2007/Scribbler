<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribbler</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="controls-container">
        <div class="controls" id="tool">
            <h2>Tools</h2>

            <div id="brush">
                <img src="/asset/icon/action/grab.svg" id="grab" class="selected" />
                <img src="/asset/icon/brush/pen.svg" id="pen" />
                <img src="/asset/icon/brush/paintbrush.svg" id="paintbrush" />
                <img src="/asset/icon/brush/spraypaint.svg" id="spraypaint" />

                <img src="/asset/icon/brush/eraser.svg" id="eraser" />
            </div>

            <div id="color">
                <input type="color" id="color-selector" value="#E90000">
                <h2 id="color-hex">#E90000</h2>
            </div>

            <div id="size">
                <div id="small-dot"></div>
                <input type="range" min="1" max="64" />
                <div id="large-dot"></div>
            </div>
        </div>

        <div class="controls" id="board">
            <h2>Boards</h2>

            <div id="board-select">
                <img src="/asset/icon/action/left.svg" id="prev-board" />
                <h2 id="board-index">0 / 0</h2>
                <img src="/asset/icon/action/right.svg" id="next-board" />
            </div>

            <img src="/asset/icon/action/delete.svg" id="board-delete" />
            <img src="/asset/icon/action/new.svg" id="board-create" />
        </div>
    </div>
    
    <canvas width="1280" height="720" id="main-canvas"></canvas>
    <div id="cursor"></div>

    <!-- Scrips -->
    <script type="module" src="comms.js"></script>
    <script type="module" src="board.js"></script>
    <script type="module" src="input.js"></script>
    <script type="module" src="viewer.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
